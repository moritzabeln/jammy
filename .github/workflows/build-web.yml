name: Build Expo Web

on:
  push:
    branches:
      - build-web
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    env:
      # Make GitHub secrets available as environment variables
      # Add secrets in: Repository Settings -> Secrets and
      # variables -> Actions
      EXPO_PUBLIC_FIREBASE_API_KEY : ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID : ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN : ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_DATABASE_URL : ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID : ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID : ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET : ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID : ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
      EXPO_PUBLIC_SPOTIFY_REDIRECT_URI_WEB : ${{ secrets.EXPO_PUBLIC_SPOTIFY_REDIRECT_URI_WEB }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Expo CLI is installed
        run: npx expo --version

      - name: Prebuild (sync native code & configs)
        run: npx expo prebuild

      - name: Export static web build
        run: npx expo export --platform web

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/